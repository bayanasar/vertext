# Continuous integration on the Forgejo instance.
#
# `runs-on: anton` is the runner registered on that machine, and it is NOT
# host mode: its label is `anton:docker://azura-ci:latest`, so a job runs
# inside that image and sees the image's toolchain, not the machine's. This
# header said the opposite until 2026-09-03, and the first step written to its
# word went red — the image carries cargo 1.98, node 18 and python3.11, but
# not python3-venv, which Debian splits out of python3 along with pip.
#
# The rule the old header stated is still the right one and now has teeth: a
# step must bring whatever it needs. `azura-ci:latest` is not built from
# anything in this repo, so nothing here may assume its contents — and a step
# that installs what it is missing keeps working if the label ever does go
# back to host mode.
#
# Placed under .forgejo/ rather than .github/: .github/workflows holds the
# GitHub mirror job, which asks for `ubuntu-latest`. No runner here offers that
# label, so it can only ever sit queued.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# One host runner, capacity 1. Without this, pushing twice to a pull request
# queues both revisions against the same machine and the older one holds it
# while already being pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: anton
    env:
      # Pinned, never `@stable`: a floating browser is a floating answer, the
      # same reason the shaping golden vendors its font and pins harfbuzz. This
      # one string is the download URL and the cache key both, so a bump is one
      # line. It is the version the golden's evidence line was recorded with.
      CHROME_VERSION: "152.0.7977.75"
    steps:
      - uses: actions/checkout@v4

      # Every `run:` is its own shell, so an `export` in one step is gone by
      # the next. $GITHUB_PATH is the mechanism that outlives a step -- the
      # version print below runs in a different shell than this line, which is
      # what makes it a check rather than a comment.
      - name: Put the Rust toolchain on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: cargo --version

      - name: Layout engine and renderer
        run: cargo test --workspace

      - name: Nav-collapse logic
        run: node examples/test-nav-toggle.js

      - name: Column budget and the theme hook
        run: node examples/test-column-budget.js

      # The theme carries its own copy of the content extension, because Quarto
      # requires an extension that uses another to embed it. Two copies of a
      # filter drift, and these have twice: once by a whole commit, once by
      # hand-edited comments that made the copy read older than it was.
      #
      # examples/test-extension.sh already asserted this, and that assertion
      # never ran: the script needs `quarto render`, which no runner here has,
      # so the copies sat unequal with every gate green. The comparison needs
      # nothing but diff, so it belongs where it will actually execute.
      #
      # Refresh the copy, never edit it:
      #   cp -R extensions/vertext extensions/vertext-theme/_extensions/
      - name: The theme's vendored filter matches its source
        run: |
          diff -r extensions/vertext \
                  extensions/vertext-theme/_extensions/vertext || {
            echo "the embedded filter has drifted from extensions/vertext"
            echo "refresh it: cp -R extensions/vertext extensions/vertext-theme/_extensions/"
            exit 1
          }

      # Shaping is a property of the FONT, so this step pins the shaper as well
      # as vendoring the face: a harfbuzz bump can change the glyphs a font
      # yields without anyone touching the repo, and the golden should be able
      # to say which of the two moved. --prove re-establishes, on every run,
      # that the golden still diffs when joining is off; a golden that has
      # never gone red is a golden whose every green is untested.
      - name: Mongolian shaping golden
        run: |
          # Try first, install only on failure: the venv is all this needs, and
          # asking apt for it unconditionally would make every run pay for a
          # package the host mode would already have. A failed venv leaves a
          # half-built directory behind, so the retry starts by clearing it.
          #
          # Both streams are silenced on the try, not just stderr: venv reports
          # this particular failure on STDOUT, so a step that recovers and goes
          # green still printed "Failing command:" into the log. The retry is
          # left loud, so a real failure still says why.
          python3 -m venv /tmp/vertext-shaping >/dev/null 2>&1 || {
            rm -rf /tmp/vertext-shaping
            apt-get update -qq && apt-get install -y -qq python3-venv
            python3 -m venv /tmp/vertext-shaping
          }
          /tmp/vertext-shaping/bin/pip install --quiet 'uharfbuzz==0.56.1'
          /tmp/vertext-shaping/bin/python tools/shaping-golden.py
          /tmp/vertext-shaping/bin/python tools/shaping-golden.py --prove

      # The step above shapes the corpus strings directly -- the binary is not
      # in that chain, so an engine that split a word in two would leave it
      # green. This one puts the binary in: every run goes through the real
      # renderer and the string is taken back out of the HTML before it is
      # shaped. It reuses the venv the step above built, and needs the release
      # binary, which nothing before this point produces.
      - name: Mongolian delivery golden
        run: |
          cargo build --release -p vertext-cli
          /tmp/vertext-shaping/bin/python tools/delivery-golden.py
          /tmp/vertext-shaping/bin/python tools/delivery-golden.py --prove

      # Everything above this line starts at the BINARY: the goldens hand it
      # text on stdin. A real document does not arrive that way -- it goes
      # pandoc -> vertext.lua -> the PUA wire protocol -> the binary -- and that
      # first half had never been executed by anything that can fail. It is also
      # the half that moves: #25 found the theme's copy of the filter a whole
      # commit behind, and the only assertion that would have caught it needed
      # `quarto render`, so it never ran.
      #
      # Quarto is not needed to run the filter. It calls `quarto.*` in exactly
      # three places, and tools/quarto-shim.lua supplies those three and nothing
      # else, then loads the real filter unmodified -- the same route urtu took
      # by hand when the U+202F crossing went into PROGRESS.
      #
      # Debian's pandoc, not a pinned 3.x: both were run against these fixtures
      # and the HTML came back byte-identical, so the apt one (~5s) is bought
      # instead of a 33MiB tarball. Pin one the way the browser is pinned if
      # they ever diverge.
      - name: The filter half of the chain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq pandoc
          pandoc --version | head -1
          /tmp/vertext-shaping/bin/python tools/filter-golden.py
          /tmp/vertext-shaping/bin/python tools/filter-golden.py --prove

      # Everything above this line proves things about text. The gate below is
      # the first one that asks a browser, which is what readers use -- and it
      # is the step this repository spent the longest not having, because
      # `azura-ci:latest` carries no browser and no npx. It brings its own.
      #
      # Three things were measured inside that image before this was written,
      # each of which would otherwise cost an afternoon:
      #
      #   * the 185MiB zip is not enough on its own. `ldd` reports 16 `not
      #     found` in this image, and the apt line below is where those come
      #     from (~7s). If a browser is ever baked into the image, this whole
      #     step collapses to the last line.
      #   * the runner's container gets the default 64MB /dev/shm, and at that
      #     size the gate's 1728x3360 grid does not fail -- it HANGS (still
      #     running at 120s, against 1.0s with the flag). `browser-golden.py`
      #     passes --disable-dev-shm-usage for exactly this; `privileged: false`
      #     on the runner means the shm size is not ours to change.
      #   * with both, the gate itself runs in 6-9s, and a COLD run of these
      #     three steps -- nothing cached, no package lists -- is 25s end to
      #     end: ~8s to fetch and unpack 185MiB, ~8s of apt, ~9s of gate. The
      #     cost here is the browser, not the gate.
      - name: The pinned browser
        id: browser
        uses: actions/cache@v4
        with:
          path: /opt/chrome
          key: chrome-for-testing-${{ env.CHROME_VERSION }}-linux64

      - name: Unpack the browser and its libraries
        env:
          # Without this, apt's debconf prints five lines about frontends it
          # cannot initialize -- on a step that went green. A log that cries
          # wolf on every run is a log nobody reads on the run that matters.
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The cache above carries the unpacked browser; the libraries are not
          # in it, because they are installed into the image's own paths and a
          # cached /opt says nothing about those. So the download is conditional
          # and the apt line is not.
          if [ ! -x /opt/chrome/chrome-linux64/chrome ]; then
            mkdir -p /opt/chrome
            curl -sSfL -o /tmp/chrome.zip \
              "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
            unzip -q /tmp/chrome.zip -d /opt/chrome
            rm -f /tmp/chrome.zip
          fi
          apt-get update -qq
          apt-get install -y -qq \
            libasound2 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 libcups2 \
            libdbus-1-3 libgbm1 libnspr4 libnss3 libxcomposite1 libxdamage1 \
            libxfixes3 libxkbcommon0 libxrandr2
          # A browser that cannot resolve its own libraries must stop here, with
          # the list, rather than inside the gate as a timeout.
          missing=$(ldd /opt/chrome/chrome-linux64/chrome | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "the browser is missing shared libraries:"
            echo "$missing"
            exit 1
          fi
          /opt/chrome/chrome-linux64/chrome --version

      - name: Mongolian browser golden
        run: |
          python3 tools/browser-golden.py --chrome /opt/chrome/chrome-linux64/chrome
